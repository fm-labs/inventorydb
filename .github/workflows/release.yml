name: Release

on:
  push:
    tags: ["v*"]

# Actions are pinned to commit SHAs (updated by Dependabot).
permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false # never build release artifacts from a cache
      - name: Compare tag with pyproject.toml version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${TAG} does not match the package version ${version} in pyproject.toml (expected v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-releases (e.g. 1.0.0a1, 1.0.0b2, 1.0.0rc1, 1.0.0.dev1)
          if [[ "${version}" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false # never build release artifacts from a cache
      - name: Build sdist and wheel
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # A dry run on TestPyPI; if the upload or the install check fails, nothing is published to PyPI.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-version, build]
    runs-on: ubuntu-latest
    # Trusted publishing, like PyPI below, but configured on test.pypi.org.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/inventorydb/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI rejects re-uploads, so re-running a release whose PyPI step failed would fail here.
          skip-existing: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Install from TestPyPI
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        # Only TestPyPI is used as the index, which works because the package has no
        # required dependencies. New uploads can take a minute to appear, so retry.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if uv run --isolated --no-project --no-cache \
                --index-url https://test.pypi.org/simple/ --with "inventorydb==${VERSION}" \
                python -c "import importlib.metadata as m, inventorydb; assert m.version('inventorydb') == '${VERSION}'"; then
              exit 0
            fi
            echo "inventorydb ${VERSION} not installable from TestPyPI yet (attempt ${attempt}), retrying in 20s ..."
            sleep 20
          done
          echo "::error::inventorydb ${VERSION} could not be installed from TestPyPI."
          exit 1

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, publish-testpypi]
    runs-on: ubuntu-latest
    # Trusted publishing: configure a publisher for this repository, workflow
    # (release.yml) and environment on PyPI; no API token is needed.
    environment:
      name: pypi
      url: https://pypi.org/project/inventorydb/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub release
    needs: [check-version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Create release with distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
