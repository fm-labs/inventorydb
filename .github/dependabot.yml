version: 2
updates:
  # Keeps the SHA-pinned actions (and their "# vX.Y.Z" comments) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"] # one PR for all action updates instead of one per action
    cooldown:
      default-days: 7 # skip releases younger than a week, in case a compromised version gets pulled
    commit-message:
      prefix: ci

  # Keeps uv.lock up to date, so CI tests against current releases.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # The >= floors in pyproject.toml are deliberate minimum supported versions
    # (tested by the "minimum dependency versions" CI job), so leave them alone and
    # only update the lockfile when a new release already satisfies them.
    versioning-strategy: increase-if-necessary
    groups:
      # Libraries the adapters integrate with; a new release can break an adapter.
      backends:
        patterns: ["redis", "pymongo", "pydantic"]
      dev-tools:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
