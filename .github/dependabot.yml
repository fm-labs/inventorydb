version: 2
updates:
  # Keeps the SHA-pinned actions (and their "# vX.Y.Z" comments) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"] # one PR for all action updates instead of one per action
    cooldown:
      default-days: 7 # skip releases younger than a week, in case a compromised version gets pulled
    commit-message:
      prefix: ci
