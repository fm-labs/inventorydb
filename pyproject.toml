[project]
name = "inventorydb"
version = "0.1.0"
description = "Simple data model storage"
requires-python = ">=3.14"
dependencies = []
authors = [
  { name="fm-labs", email="code@fmlabs.dev" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/fm-labs/inventorydb"
Issues = "https://github.com/fm-labs/inventorydb/issues"


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pydantic>=2.12.5",
    "pymongo>=4.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "redis>=7.4.0",
    "testcontainers>=4.14.2",
]

